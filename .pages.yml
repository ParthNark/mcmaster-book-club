# Pages CMS configuration — edit site content at https://app.pagescms.org
# Every save commits to this repo, and the site redeploys from main.

# Photo uploads (Past Events → images/events, Our Team → images/ourteam).
# Large photos are shrunk automatically after upload by
# .github/workflows/compress-photos.yml.
media:
  input: images
  output: /images
  rename: safe
  categories: [image]

content:
  - name: team
    label: Our Team
    type: file
    path: data/team.json
    format: json
    fields:
      - name: year
        label: Year shown on the cover
        type: string
        description: e.g. "2026 / 27".
      - name: members
        label: Team members
        type: object
        list: true
        description: The book shows one member per spread, in this order. Drag to reorder.
        fields:
          - name: name
            label: First name
            type: string
            required: true
            description: Shown as the handwritten caption on the photo.
          - name: full_name
            label: Full name
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
            description: e.g. "Co-President" or "VP Events".
          - name: photo
            label: Photo
            type: image
            description: A portrait photo works best. Large photos are shrunk automatically.
            options:
              path: images/ourteam
          - name: email
            label: Email
            type: string
          - name: instagram
            label: Instagram handle
            type: string
            description: Without the @, e.g. maddie_taylor3.
          - name: linkedin
            label: LinkedIn link
            type: string
            description: Optional. The full profile URL.
          - name: favourite_book
            label: Favourite book
            type: string
            description: Optional, shows on their page.
          - name: currently_reading
            label: Currently reading
            type: string
            description: Optional, shows on their page.

  - name: past_events
    label: Past Events
    type: file
    path: data/past-events.json
    format: json
    fields:
      - name: chapters
        label: Past events
        type: object
        list: true
        description: Shown on the Past Events page in this order, so keep the newest event at the top. Chapter numbers count up from the bottom.
        fields:
          - name: title
            label: Event name
            type: string
            required: true
          - name: date_label
            label: Date shown
            type: string
            description: e.g. "Oct 2026". The title page's date range runs from the bottom event's date to the top event's, so use "Mon Year" for those.
          - name: photos
            label: Photos
            type: image
            required: true
            description: Up to 15 photos. The first three are the polaroids on this event's pages (the first is the big one), and the first one can also appear on the scrapbook's title page, so put a group photo first. Drag to reorder.
            options:
              multiple:
                max: 15
              unique: true
              path: images/events
          - name: captions
            label: Polaroid captions
            type: string
            list: true
            description: Optional handwritten captions for the first three photos, in the same order (big photo first). Keep them short, e.g. "the couch crew".
          - name: note
            label: Handwritten note
            type: string
            description: Optional. Shown under the big photo. Leave empty to show how many photos are in the album.

  - name: books
    label: Books
    type: file
    path: data/books.json
    format: json
    fields:
      - name: voting_open
        label: Voting open
        type: boolean
        description: Shows the "Vote for next month's book" button on the Current Read page.
      - name: vote_form_url
        label: Voting form link
        type: string
        description: Google Form link for the vote. Only used while voting is open.
      - name: store_deal
        label: Campus Store deal
        type: string
        description: Shown in the homepage ticker for each current book, e.g. "10% off". Leave empty to hide it.
      - name: books
        label: Books
        type: object
        list: true
        description: Current books appear on the site in this order. Past books appear newest first, so keep recent ones near the top.
        fields:
          - name: status
            label: Status
            type: select
            required: true
            description: "current = shown as this month's pick. past = listed under Past Reads. upcoming = saved but hidden."
            options:
              values: [current, upcoming, past]
          - name: isbn
            label: ISBN
            type: string
            description: The cover, title, author and description are fetched from Open Library using this.
          - name: cover
            label: Cover image (optional)
            type: image
            description: Only if the Open Library cover is missing or wrong. Otherwise the cover is found automatically from the ISBN.
            options:
              path: images/covers
          - name: work_id
            label: Open Library work ID
            type: string
            description: Optional. Use only if the ISBN finds the wrong book (e.g. OL20059198W).
          - name: title
            label: Title
            type: string
            required: true
          - name: author
            label: Author
            type: string
          - name: month
            label: Month
            type: string
            description: e.g. "September 2026" or "January Fantasy Book".
          - name: summary
            label: Summary
            type: text
            description: Shown on the Current Read page (in place of the Open Library description) and kept for Past Reads. Leave empty to use Open Library's.
          - name: tags
            label: Tags
            type: string
            list: true
          - name: meeting_time
            label: Meeting time
            type: string
            description: 'Include the date with the year, e.g. "Thu, Nov 26, 2026 — 6:00–7:00 PM". Current Read uses the date for "Tonight" / "Discussed", and to group books discussed in the same month.'
          - name: meeting_location
            label: Meeting location
            type: string
          - name: meeting_notes
            label: Meeting notes
            type: text
          - name: discussion_prompts
            label: Discussion prompts
            type: string
            list: true
          - name: goodreads_url
            label: Goodreads link
            type: string
          - name: rating_text
            label: Rating text
            type: string
            description: Optional, e.g. "4.2 ★ on Goodreads". Shown under the author on the Current Read page.

  - name: events
    label: Events
    type: file
    path: data/events.json
    format: json
    fields:
      - name: events
        label: Events
        type: object
        list: true
        description: Upcoming events show on the homepage and are hidden there the day after their date. The calendar on Meetings & Events shows every event, so past ones stay on their month.
        fields:
          - name: title
            label: Title
            type: string
            required: true
            description: 'For book discussions start with "Book Discussion:", e.g. "Book Discussion: The Secret History".'
          - name: type
            label: Type
            type: select
            description: Sets the colour of the stamp on the calendar and which filter it falls under.
            default: social
            options:
              values:
                - value: discussion
                  label: Book discussion
                - value: social
                  label: Social
                - value: deadline
                  label: Deadline
                - value: other
                  label: Other
          - name: date
            label: Date
            type: date
            required: true
          - name: time
            label: Time
            type: string
            description: e.g. "6:00 PM".
          - name: location
            label: Location
            type: string
          - name: description
            label: Description
            type: text
          - name: instagram_url
            label: Instagram post link
            type: string
          - name: rsvp_url
            label: RSVP link
            type: string
